<div class="flex min-w-0 flex-auto flex-col">
    <div class="flex-auto p-6 sm:p-10">
        <div class="container">
            <h1 *ngIf="!esEdicion" class="text-4xl font-bold pb-3 text-contrast">{{titulo}}s</h1>

            <app-tabla-lista #tabla [title]="titulo" [dataList]="listaNotificaciones" [keyLabels]="keyLabelsTable"
                [pagination]="paginacion" [editar]="false" [bloqueo]="false" (refresh)="refrescar()"
                (add)="nuevaNotificacion()" (view)="verNotificacion($event)" (requestAllData)="descargarExcelCompleto()"
                (sortChange)="handleSortEvent($event)" (search)="handleSearchEvent($event)"
                (pageChange)="handlePageEvent($event)"
                [nemonicoMenu]="nemonicoMenu" >
            </app-tabla-lista>
        </div>
    </div>
</div>
