<div class="grid grid-cols-1 centered-title">
    <div class="col-start-1 col-span-2">
        <h2 class="text-2xl font-bold" mat-dialog-title>{{titulo}}
        </h2>
    </div>
    <div class="col-start-3 col-span-2 pt-2">
        <button mat-icon-button mat-dialog-close>
            <mat-icon>close</mat-icon>
        </button>
    </div>
</div>
<mat-dialog-content class="custom-dialog">
    <mat-tree #tree [dataSource]="dataSource" [childrenAccessor]="childrenAccessor">
        <!-- This is the tree node template for leaf nodes -->
        <mat-tree-node *matTreeNodeDef="let node" matTreeNodePadding style="cursor:pointer;"
            (click)="seleccionoNodo(node)">
            <!-- use a disabled button to provide padding for tree leaf -->
            <button mat-icon-button disabled></button>
            <div class="grid grid-rows-1 grid-flow-col gap-2">
                @if(node.icono){
                <mat-icon class="align-middle" [svgIcon]="node.icono">
                </mat-icon>
                }
                {{node.nombre}}
            </div>
        </mat-tree-node>
        <!-- This is the tree node template for expandable nodes -->
        <mat-tree-node *matTreeNodeDef="let node;when: hasChild" matTreeNodePadding matTreeNodeToggle
            [cdkTreeNodeTypeaheadLabel]="node.nombre">
            <button mat-icon-button matTreeNodeToggle [attr.aria-label]="'Toggle ' + node.nombre">
                <mat-icon class="mat-icon-rtl-mirror">
                    {{tree.isExpanded(node) ? 'expand_more' : 'chevron_right'}}
                </mat-icon>
            </button>
            <div class="grid grid-rows-1 grid-flow-col gap-2">
                @if(node.icono){
                <mat-icon class="align-middle" [svgIcon]="node.icono">
                </mat-icon>
                }
                <strong class="text-2md font-bold pb-3 text-contrast">{{node.nombre}}</strong>
            </div>
        </mat-tree-node>
    </mat-tree>
</mat-dialog-content>
