<mat-nav-list>
    <mat-list-item>
        <button class="w-full" mat-button color="primary" (click)="accion('editar')">
            <mat-icon fontIcon="edit"></mat-icon>Editar</button>
    </mat-list-item>
    <mat-list-item>
        <button class="w-full" mat-button color="warn" (click)="accion('eliminar')"><mat-icon
                fontIcon="delete"></mat-icon>&nbsp;Eliminar</button>
    </mat-list-item>
    @if(data.mostrar){
    <mat-list-item>
        <button class="w-full" mat-button color="accent" (click)="accion(data.keyAccion)">
            <mat-icon class="bold-icon" style="font-size: 32px; font-weight: bold;"
                [fontIcon]="data.fontIcon"></mat-icon>&nbsp;{{data.textAccion}}
        </button>
    </mat-list-item>
    }
</mat-nav-list>
