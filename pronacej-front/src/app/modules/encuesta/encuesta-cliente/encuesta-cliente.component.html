<div class="flex min-w-0 flex-auto flex-col">
    <div class="flex-auto p-6 sm:p-10">
        <div class="container">
            <h1 class="text-4xl font-bold pb-3">Encuesta de Satisfacion</h1>
            <form [formGroup]="surveyForm" (ngSubmit)="onSubmit()">
                <div class="survey-container">

                    <div *ngFor="let question of steps[currentStep]">
                        <p class="text-lg font-medium">{{ question.titulo }}</p>
                        <div *ngFor="let option of question.element">
                            <label>
                                <input type="checkbox" [name]="option.nombreForm" [value]="option.nombre"  [formControlName]="option.nombreForm"
                                (change)="registrarValor(option, $event.target)">
                                {{ option.nombre }}
                            </label>
                        </div>
                        <div *ngIf="question.tieneObservacion" class="observation-field">
                            <div class="flex">
                                <mat-form-field class="flex-auto">
                                    <textarea  matInput [placeholder]="'Escriba aquí su observación'"
                                        [rows]="3" [formControlName]="question.idObservacion"></textarea>
                                    <mat-icon class="icon-size-5" matPrefix
                                        [svgIcon]="'heroicons_solid:bars-3-bottom-left'"></mat-icon>
                                </mat-form-field>
                            </div>
                        </div>
                        <div *ngIf="question.tieneAdjunto" class="attachment-field">

                            <input type="file" [name]="question.nombreForm" [formControlName]="question.idAdjunto">
                        </div>
                    </div>

                    <div class="navigation-buttons">
                        <button (click)="previous()" [disabled]="currentStep === 0">Anterior</button>
                        <button (click)="next()" *ngIf="currentStep < steps.length - 1">Siguiente</button>
                        <button (click)="submitSurvey()" *ngIf="currentStep === steps.length - 1">Enviar</button>
                    </div>
                </div>
            </form>
            {{ surveyForm.value | json }}
        </div>
    </div>
</div>
