<div class="bg-card flex flex-col min-h-0 min-w-0 h-full w-full">
    <!-- Header -->
    <div class="relative flex flex-0 flex-col border-b px-6 py-8 md:px-8">
        <!-- Title -->
        <h1 class="text-4xl font-bold tracking-tight py-4 text-contrast">Crear colaborador - usuario</h1>
    </div>

    <!-- Stepper -->
    <div class="flex flex-auto pl-10 pr-10 h-full w-full desactivado">
        <mat-stepper class="rounded-md h-full w-full" [linear]="true" #stepper>
            <mat-step>
                <ng-template matStepLabel>
                    <h1 class="text-2xl font-bold tracking-tight">Colaborador</h1>
                </ng-template>
                <app-funcionarios-crear-editar [esFlujo]="true" (avanzarPaso)="onAvanzarPaso($event)"></app-funcionarios-crear-editar>
            </mat-step>
            <mat-step>
                <ng-template matStepLabel>
                    <h1 class="text-2xl font-bold tracking-tight">Usuario</h1>
                </ng-template>
                <app-usuarios-crear-editar [funcionarioData]="funcionarioData" [esFlujo]="true"></app-usuarios-crear-editar>
            </mat-step>
        </mat-stepper>
    </div>
</div>
