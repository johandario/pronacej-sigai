<div class="flex min-w-0 flex-auto flex-col">
  <div class="flex-auto p-6 sm:p-10">
    <div class="container">
      <h1 class="text-4xl font-bold pb-3 text-contrast">{{tituloPantalla}}</h1>
      <app-tabla-lista #tabla [title]="'institución'" [dataList]="listaProcesos" [keyLabels]="keyLabelsTable"
        (refresh)="obtenerProcesos()" (add)="agregarProceso()" (edit)="editarProceso($event)"
        (delete)="eliminarProceso($event)" (refresh)="refrescar()" (search)="handleSearchEvent($event)"
        [pagination]="paginacion" (requestAllData)="descargarExcelCompleto()" (pageChange)="handlePageEvent($event)"
        [bloqueo]="false" [icono]="'visibility'" [tooltip]="'Visualizar'" (customAction)="visualizar($event)"
        [eliminar]="false">
      </app-tabla-lista>
    </div>
  </div>
</div>
