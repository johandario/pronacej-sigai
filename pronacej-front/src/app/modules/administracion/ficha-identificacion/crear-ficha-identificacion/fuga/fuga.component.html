<div class="flex min-w-0 flex-auto flex-col">
    <div class="flex-auto p-6 sm:p-10">
        <div class="container">
            <h1 class="text-4xl font-bold pb-3 text-contrast">{{tituloPantalla}}</h1>
            <div class="buttons">
                <!-- Contenedor para el input alineado a la izquierda -->
                <div class="input-container">
                    <mat-form-field class="fuse-mat-dense fuse-mat-rounded min-w-64 justify-left"
                        [subscriptSizing]="'dynamic'">
                        <mat-icon class="icon-size-5" matPrefix
                            [svgIcon]="'heroicons_solid:magnifying-glass'"></mat-icon>
                        <input matInput
                            [placeholder]="'Buscar REGISTRO'" />
                    </mat-form-field>
                    <button class="ml-3">
                        <img src="images/icons/xlsx.png" class="size-9">
                    </button>
                </div>
                <!-- Contenedor para los botones alineados a la derecha -->
                <div class="buttons-container">

                    <button mat-fab extended color="accent">
                        <mat-icon>refresh</mat-icon>Refrescar
                    </button>
                    <button mat-fab extended color="primary" class="ml-3" (click)="agregarFuga()">
                        <mat-icon>add</mat-icon>Agregar {{tituloPantalla}}
                    </button>
                </div>
            </div>  

            <div class="mt-8 overflow-auto">
             @if(listaFuga.length > 0){
                    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 ">
                        @for(key of getKeys(); track $index){
                            <ng-container [matColumnDef]="key">
                                <th mat-header-cell *matHeaderCellDef>{{keyLabelsTable[key]}}</th>
                                <td mat-cell *matCellDef="let fuga; let i = index;">
                                    @if(key == "acciones"){
                                        <button mat-icon-button >
                                            <mat-icon class="text-message">visibility</mat-icon>
                                        </button>
                                        <button mat-icon-button >
                                            <mat-icon class="text-secondary">edit</mat-icon>
                                        </button>
                                        <button mat-icon-button (click)="eliminarFuga(fuga)">
                                            <mat-icon class="text-contrast">delete</mat-icon>
                                        </button>
                                    }@else{
                                        @if(key == "numero"){
                                            {{totalItems - (i + (page * size))}}
                                        }@else if(key == "fechaFuga"){
                                            {{ getLocalDate(fuga[key]) }}
                                        }
                                    }
                                </td>
                            </ng-container>
                        }

                        <tr mat-header-row *matHeaderRowDef="getKeys()"></tr>
                        <tr mat-row *matRowDef="let row; columns: getKeys();let i = index"></tr>
                    </table>
                }
            </div>

            <div class="mt-8 text-rigth">
                <mat-paginator (page)="handlePageEvent($event)" [length]="totalItems" [pageSize]="size"
                    [showFirstLastButtons]="true" [pageSizeOptions]="listSize" [pageIndex]="page">
                </mat-paginator>
            </div>
        </div>
    </div>
</div>
