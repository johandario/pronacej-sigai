<div class="flex min-w-0 flex-auto flex-col">
    <div class="flex-auto p-6 sm:p-10">
        <div class="container">
            <app-tabla-datos #tabla [titulo]="tituloPantalla" [listaDatos]="listaSeguimientos"
                [etiquetasColumnas]="columnasMostrar" [paginacion]="paginacion" [permitirAgregar]="true"
                [permitirEditar]="true" [permitirEliminar]="true" [permitirBloquear]="false" [permitirImprimir]="true"
                [permitirVisualizar]="true" (refrescar)="obtenerListaSeguimientos()" (agregar)="agregarSeguimiento()"
                (editar)="editarSeguimiento($event)" (ver)="visualizarSeguimiento($event)"
                (eliminar)="eliminarSeguimiento($event)" (imprimir)="imprimirSeguimiento($event)"
                (requestAllData)="descargarExcelCompleto()" (cambioPagina)="manejarEventoPaginacion($event)"
                (cambioOrden)="manejarEventoOrdenamiento($event)" (buscar)="manejarEventoBusqueda($event)"
                [icono]="'insert_drive_file'" [textoAyuda]="'Subir documento'"
                (accionPersonalizada)="subirDocumento($event)" [icono2]="'list'" [textoAyuda2]="'Ver documentos'"
                (accionPersonalizada2)="verDocumentos($event)"
                [nemonicoMenu]="nemonicoMenu" >
            </app-tabla-datos>
        </div>
    </div>
</div>
