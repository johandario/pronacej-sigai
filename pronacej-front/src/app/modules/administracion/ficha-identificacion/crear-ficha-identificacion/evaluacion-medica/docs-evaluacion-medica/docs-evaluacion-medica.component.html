<div class="bg-card rounded-md relative flex-1 flex-0 flex-col m-2 border-b px-6 py-8 sm:flex-row sm:items-center sm:justify-between md:px-8">
    @if(subirDocumento){
            <!-- Header -->
        <div class="relative flex flex-0 flex-col border-b pb-8 sm:flex-row sm:items-center sm:justify-between md:px-8">
            <!-- Titulo -->
            <h1 class="text-2xl font-bold tracking-tight">Subir Documento</h1>
            <!-- Actiones -->
            <div class="mt-6 flex shrink-0 items-center sm:ml-4 sm:mt-0">
                <!-- Boton cancelar -->
                <button class="ml-4" mat-flat-button [color]="'accent'" (click)="toggleSubirDocumento()">
                    <span class="ml-2 mr-1">Cancelar</span>
                </button>
            </div>
        </div>
        <app-subir-documento></app-subir-documento>
    } @else {
        <!-- Header -->
    <div class="relative flex flex-0 flex-col border-b pb-8 sm:flex-row sm:items-center sm:justify-between md:px-8">
        @if (!isLoading) {
            <div class="absolute inset-x-0 bottom-0">
                <mat-progress-bar [mode]="'indeterminate'"></mat-progress-bar>
            </div>
        }
        <!-- Titulo -->
        <h1 class="text-2xl font-bold tracking-tight">Documentos adjuntos</h1>
        <!-- Actiones -->
        <div class="mt-6 flex shrink-0 items-center sm:ml-4 sm:mt-0">
            <!-- Buscar -->
            <mat-form-field class="fuse-mat-dense fuse-mat-rounded min-w-64" [subscriptSizing]="'dynamic'">
                <mat-icon class="icon-size-5" matPrefix [svgIcon]="'heroicons_solid:magnifying-glass'"></mat-icon>
                <input matInput [formControl]="searchInputControl" [autocomplete]="'off'"
                    [placeholder]="'Buscar documento'" />
            </mat-form-field>
            <!-- Boton nuevo -->
            <button class="ml-4" mat-flat-button [color]="'primary'" (click)="toggleSubirDocumento()">
                <mat-icon [svgIcon]="'heroicons_outline:plus'"></mat-icon>
                <span class="ml-2 mr-1">Agregar documento</span>
            </button>
        </div>
    </div>

    <!-- Main -->
    <div class="flex flex-auto  pl-10 pr-10">
        <!-- Lista Documentos -->

        @if(isLoading){
            <div class="flex flex-auto flex-col  sm:mb-18 sm:overflow-y-auto">

                <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 mt-10">
        
                    <ng-container matColumnDef="acciones">
                        <th mat-header-cell *matHeaderCellDef> Acciones </th>
                        <td mat-cell *matCellDef="let element">
                            <button mat-button mat-button color="primary" (click)="accion()">
                                Acciones
                            </button>
                        </td>
                    </ng-container>
    
                    <ng-container matColumnDef="nombre">
                        <th mat-header-cell *matHeaderCellDef> Nombre </th>
                        <td mat-cell *matCellDef="let element"> {{element.nombre}} </td>
                    </ng-container>
    
                    <ng-container matColumnDef="desc">
                        <th mat-header-cell *matHeaderCellDef> Descripción </th>
                        <td mat-cell *matCellDef="let element"> {{element.descripcion}} </td>
                    </ng-container>

                    <ng-container matColumnDef="tipo">
                        <th mat-header-cell *matHeaderCellDef> Tipo </th>
                        <td mat-cell *matCellDef="let element"> {{element.tipo}} </td>
                    </ng-container>
                    <ng-container matColumnDef="size">
                        <th mat-header-cell *matHeaderCellDef> Tamaño </th>
                        <td mat-cell *matCellDef="let element"> {{element.size}} </td>
                    </ng-container>
    
                    <ng-container matColumnDef="fecha">
                        <th mat-header-cell *matHeaderCellDef> Fecha </th>
                        <td mat-cell *matCellDef="let element"> {{element.fecha}} </td>
                    </ng-container>
    
                    <tr mat-header-row *matHeaderRowDef="columnsDocumentos"></tr>
                    <tr mat-row *matRowDef="let row; columns: columnsDocumentos;"></tr>
    
                    
                </table>
                <div class="z-10 border-b bg-gray-50 dark:bg-transparent sm:inset-x-0 sm:bottom-0 sm:border-b-0 sm:border-t">
                    <mat-paginator (page)="handlePageEvent($event)" [length]="totalItems" [pageSize]="size"
                        [showFirstLastButtons]="true" [pageSizeOptions]="listSize" [pageIndex]="page">
                    </mat-paginator>
                </div>
            </div>
            
        }
    </div>
    }
</div>
