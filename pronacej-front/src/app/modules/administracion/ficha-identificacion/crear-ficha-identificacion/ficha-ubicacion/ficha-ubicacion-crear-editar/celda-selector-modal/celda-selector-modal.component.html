<div class="grid grid-cols-1 md:grid-cols-2 gap-3 items-center">
    <h2 mat-dialog-title class="text-2xl font-bold text-contrast mb-0">Seleccionar celda</h2>

    <div class="flex justify-end">
        <button mat-icon-button type="button" aria-label="Cerrar selector" (click)="cancelar()">
            <mat-icon>close</mat-icon>
        </button>
    </div>
</div>

<mat-dialog-content class="dialog-content">
    <h3 class="text-contrast">Solamente las celdas son seleccionables</h3>

    <div class="tree-container">
        <mat-tree [dataSource]="dataSource" [treeControl]="treeControl">
            <mat-tree-node *matTreeNodeDef="let node" matTreeNodePadding>
                <!-- <button mat-icon-button disabled></button> -->
                <button
                    mat-button
                    type="button"
                    class="node-label"
                    [class.node-label-disabled]="!esSeleccionable(node)"
                    [disabled]="!esSeleccionable(node)"
                    (click)="seleccionar(node)">                    
                    {{ node.nombre }}
                </button>
            </mat-tree-node>
            <!-- [matTooltip]="node.rutaCompleta" -->

            <mat-nested-tree-node *matTreeNodeDef="let node; when: hasChild">
                <div class="mat-tree-node" matTreeNodePadding>
                    <button
                        mat-icon-button
                        type="button"
                        [attr.aria-label]="'Expandir ' + node.nombre"
                        matTreeNodeToggle>
                        <mat-icon class="mat-icon-rtl-mirror">
                            {{ treeControl.isExpanded(node) ? 'expand_more' : 'chevron_right' }}
                        </mat-icon>
                    </button>
                    <span class="font-semibold">{{ node.nombre }}</span>
                     <!-- [matTooltip]="node.rutaCompleta" -->
                </div>

                <div role="group" [class.hidden]="!treeControl.isExpanded(node)">
                    <ng-container matTreeNodeOutlet></ng-container>
                </div>
            </mat-nested-tree-node>
        </mat-tree>
    </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancelar()">Cancelar</button>
</mat-dialog-actions>
