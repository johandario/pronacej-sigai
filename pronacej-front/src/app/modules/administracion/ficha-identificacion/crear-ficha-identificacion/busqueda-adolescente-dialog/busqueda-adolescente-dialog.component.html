<div mat-dialog-title class="text-lg font-bold pb-3 text-primary">Búsqueda de adolescentes</div>
<div mat-dialog-content>    
    <div class="container">
        <app-tabla-datos #tabla [titulo]="'adolescente'" [listaDatos]="listaAdolescentes" [etiquetasColumnas]="etiquetasColumnas"
            [permitirAgregar]="false" [permitirExcel]="false" [permitirVisualizar]="false" [permitirBloquear]="false"
            [permitirEditar]="false" [permitirEliminar]="false" [permitirImprimir]="false"
            icono="input" textoAyuda="Obtener datos" (accionPersonalizada)="seleccionarAdolescente($event)"
            (refrescar)="obtenerAdolescentes()" [paginacion]="paginacion" 
            (cambioPagina)="onCambiarPagina($event)" (buscar)="onBuscar($event)">
        </app-tabla-datos>
    </div>
</div>
<div mat-dialog-actions align="end">
  <button mat-flat-button mat-dialog-close color="accent">
    Cerrar
    <!-- <mat-icon>close</mat-icon> -->
  </button>          
</div>
