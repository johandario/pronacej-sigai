<div class="flex min-w-0 flex-auto flex-col">
    <div class="flex-auto p-6 sm:p-10">
        <div class="container">
            <h1 class="text-4xl font-bold pb-3 text-contrast">{{tituloPantalla}}</h1>
            <app-tabla-lista #tabla [title]="'sanciones disciplinarias'" [dataList]="listaProcesos" [keyLabels]="keyLabelsTable"
                (refresh)="obtenerProcesos()" (add)="agregarProceso()" (edit)="editarProceso($event)"
                (delete)="eliminarProceso($event)" (requestAllData)="descargarExcelCompleto()"
                (pageChange)="handlePageEvent($event)" (search)="handleSearchEvent($event)" [editar]="false" [eliminar]="false"  [bloqueo]="false"
                (view)="visualizar($event)"
                [icono]="'print'" [tooltip]="'Abrir para impresión'" (customAction)="generarPDF($event)"
                (sortChange)="handleSortEvent($event)" [icono2]="'insert_drive_file'" [tooltip2]="'Subir documento'"
                        (customAction2)="subirDocumento($event)" [icono3]="'list'" [tooltip3]="'Ver documentos'"
                        (customAction3)="verDocumentos($event)"
                        [nemonicoMenu]="nemonicoMenu">
            </app-tabla-lista>
        </div>
    </div>
</div>
