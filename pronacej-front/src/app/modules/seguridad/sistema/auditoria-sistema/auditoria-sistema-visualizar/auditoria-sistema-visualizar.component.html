<div class="container">
    <div class="text-end">
        <mat-icon style="cursor: pointer;" fontIcon="refresh" (click)="refresh()"></mat-icon>
    </div>
    <div class="mt-8 overflow-auto">
        @if(listaDeAccionessistemaDto?.length > 0){
        <div class="example-container mat-elevation-z8">

            <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 table-container">
                @for(key of getKeys(); track $index){
                <ng-container [matColumnDef]="key">
                    <th mat-header-cell *matHeaderCellDef>{{keyLabelsTable[key]}}</th>
                    <td mat-cell *matCellDef="let auditoria; let i = index;">
                        @if(esJson(key)){
                        <button mat-button (click)="verJson(key, auditoria[key])"
                            class="text-white bg-primary"><mat-icon class="text-white">visibility</mat-icon> &nbsp; Ver
                        </button>
                        }@else {
                        {{auditoria[key]}}
                        }
                    </td>
                </ng-container>
                }

                <tr mat-header-row *matHeaderRowDef="getKeys(); sticky: true"></tr>
                <tr mat-row *matRowDef="let row; columns: getKeys();let i = index"></tr>
            </table>
        </div>
        }@else {
        <p>Sin datos a mostrar</p>
        }
    </div>

    <div class="mt-8 text-rigth">
        <mat-paginator (page)="handlePageEvent($event)" [length]="totalItems" [pageSize]="size"
            [showFirstLastButtons]="true" [pageSizeOptions]="sizeList" [pageIndex]="page">
        </mat-paginator>
    </div>

</div>
