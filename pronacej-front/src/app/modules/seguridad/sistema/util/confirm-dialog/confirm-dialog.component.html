<h1 mat-dialog-title class="text-2xl font-bold pb-3">¿Estás seguro?</h1>
    <div class="body" mat-dialog-content>
      <p>¿Seguro que quieres eliminar esta jerarquía?</p>
    </div>
    <div class="buttons" mat-dialog-actions>
      <button mat-flat-button color="accent" (click)="onCancel()">No</button>
      <button mat-flat-button color="primary" (click)="onConfirm()">Sí</button>
    </div>
