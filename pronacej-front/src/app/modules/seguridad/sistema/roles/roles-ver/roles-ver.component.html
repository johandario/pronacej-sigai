<div class="flex min-w-0 flex-auto flex-col">
    <div class="flex-auto p-6 sm:p-10">
        <div class="container">
            <h1 class="text-4xl font-bold pb-3 text-contrast">Roles</h1>
            <app-tabla-lista #tabla [title]="'Roles'" [dataList]="listaDeRoles" [keyLabels]="keyLabelsTable"
                [pagination]="paginacion" (refresh)="obtenerRoles()" (add)="agregarRol()" (edit)="editarRol($event)"
                (delete)="eliminarRol($event)" (requestAllData)="descargarExcelCompleto()"
                (pageChange)="handlePageEvent($event)" (sortChange)="handleSortEvent($event)"
                (search)="handleSearchEvent($event)" [bloqueo]="false">
            </app-tabla-lista>
        </div>
    </div>
</div>
