<!-- Loading bar -->
<fuse-loading-bar></fuse-loading-bar>

<!-- Navigation -->
<fuse-vertical-navigation #nav class="dark bg-primary print:hidden text-bold" [appearance]="navigationAppearance"
    [mode]="isScreenSmall ? 'over' : 'side'" [name]="'mainNavigation'" [navigation]="navigation.default"
    [opened]="!isScreenSmall">
    <!-- Navigation header hook -->
    <ng-container fuseVerticalNavigationContentHeader>
        <!-- Logo -->
        <div class="flex h-20 items-center justify-center mb-2">
            <img class="max-h-20" *ngIf="(this.navComponent && this.navComponent.isOpened) || this.navOpened"
                src="images/logo/logo.png" alt="Logo image" />
            <img class="max-h-20" *ngIf="this.navComponent && !this.navComponent.isOpened && !this.navOpened"
                src="images/logo/logo-recortado.png" alt="Logo image" />
        </div>
    </ng-container>
</fuse-vertical-navigation>

<!-- Wrapper -->
<div class="flex w-full min-w-0 flex-auto flex-col">
    <!-- Header -->
    <div
        class="bg-card relative z-49 flex h-16 w-full flex-0 items-center px-4 shadow dark:border-b dark:bg-transparent dark:shadow-none md:px-6 print:hidden">
        <div class="flex items-center space-x-2 pr-2">
            <!-- Navigation toggle button -->
            <button mat-icon-button (click)="toggleNavigation('mainNavigation')">
                <mat-icon [svgIcon]="'heroicons_outline:bars-3'"></mat-icon>
            </button>
            <!-- Navigation appearance toggle button -->
            <button class="hidden md:inline-flex" mat-icon-button (click)="toggleNavigationAppearance()">
                <mat-icon [svgIcon]="'heroicons_outline:arrows-right-left'"></mat-icon>
            </button>
        </div>
        <!-- Components -->
        <div class="ml-auto flex items-center space-x-0.5 pl-2 sm:space-x-2">
            <!--languages></languages-->
            <div *ngIf="funcionarioActivo" class="grid-col-1 justify-center items-center text-center">
                <!-- <h3 class="font-bold pr-3 text-primary">{{funcionarioActivo?.departamento}}</h3> -->
                <button (click)="validarJerarquia()"
                    class="font-bold pr-3 text-primary bg-transparent border-none cursor-pointer focus:outline-none hover:underline"
                    style="background: none; border: none;">
                    {{ funcionarioActivo?.departamento }}
                </button>
                <h3 class="font-bold pr-3 text-accent">{{funcionarioActivo?.cargo}}</h3>
            </div>
            <fuse-fullscreen class="hidden md:block"></fuse-fullscreen>
            <!--search [appearance]="'bar'"></search-->
            <!--shortcuts></shortcuts-->
            <!--messages></messages-->
            <!--notifications></notifications-->
            <!--button class="lg:hidden" mat-icon-button (click)="quickChat.toggle()">
                <mat-icon [svgIcon]="'heroicons_outline:chat-bubble-left-right'"></mat-icon>
            </button-->
            <mat-chip *ngIf="funcionarioActivo" class="ml-2">
                {{ funcionarioActivo.nombres }} {{ funcionarioActivo.apellidos }}
            </mat-chip>
            <user></user>
        </div>
    </div>

    <!-- Content -->
    <div class="flex flex-auto flex-col">
        <!-- *ngIf="true" hack is required here for router-outlet to work correctly.
             Otherwise, layout changes won't be registered and the view won't be updated! -->
        @if (true) {
        <router-outlet></router-outlet>
        }
    </div>

    <!-- Footer -->
    <div
        class="bg-card relative z-49 flex h-14 w-full flex-0 items-center justify-start border-t px-4 dark:bg-transparent md:px-6 print:hidden">
        <span class="text-secondary font-medium">PRONACEJ &copy; {{ currentYear }}</span>
    </div>
</div>
